<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base target="_top">
    <title>BOJ 스터디 문제 출제</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="bg-gray-100 text-gray-800 p-4 sm:p-6 md:p-8">
    <div id="tooltip"></div>

    <div class="max-w-4xl mx-auto bg-white p-6 sm:p-8 rounded-2xl shadow-lg">
        <header class="mb-6 border-b pb-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
                <h1 class="text-3xl font-bold text-gray-900">BOJ 문제 출제</h1>
                <p class="text-gray-600 mt-2">등록된 ID가 <strong>풀지 않은 문제</strong>를 조건에 맞게 출제합니다.</p>
            </div>
            <a href="pages/subscribe/index.html" class="inline-flex items-center justify-center px-5 py-2.5 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 focus:ring-4 focus:outline-none focus:ring-indigo-300 transition-all shadow-md">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
                </svg>
                정기 구독 신청하기
            </a>
        </header>
        <main>
            <section id="user-management" class="mb-8">
                <h2 class="text-xl font-semibold text-gray-800 mb-3">1. BOJ ID 관리</h2>
                <div class="bg-gray-50 p-4 rounded-lg border">
                    <div class="flex flex-col sm:flex-row gap-2 mb-4">
                        <input type="text" id="new-user-id" class="flex-grow px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="백준 ID 입력">
                        <button id="addUserBtn" class="bg-blue-500 text-white font-bold py-2 px-4 rounded-md hover:bg-blue-600 transition-colors">추가</button>
                    </div>
                    <div id="user-list-container">
                        <p class="text-sm text-gray-500 rule-list-title">BOJ ID 목록 <strong style="color: blue;">최소 1개 이상</strong></p>
                        <ul id="user-list" class="mt-2 flex flex-wrap gap-2"></ul>
                    </div>
                </div>
            </section>

            <section id="problem-generator" class="mb-8">
                <h2 class="text-xl font-semibold text-gray-800 mb-3">2. 문제 출제 조건 설정</h2>
                <div id="rules-container" class="space-y-4">
                </div>
                <div class="mt-4">
                    <button id="addRuleBtn" class="w-full bg-gray-200 text-gray-700 font-bold py-2 px-4 rounded-md hover:bg-gray-300 transition-colors">
                        + 조건 추가하기
                    </button>
                </div>
            </section>

            <div id="status" class="mt-4 text-center font-medium"></div>
        </main>
    </div>

    <script type="module" src="assets/js/script.js"></script>
</body>

</html>
