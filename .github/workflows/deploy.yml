name: Deploy to GitHub Pages

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 소스 코드 내의 키워드를 GitHub Secrets 값으로 치환
      - name: Inject Supabase Secrets
        run: |
          # 1. subscribe.js 치환
          sed -i "s|___SUPABASE_URL___|${{ secrets.SUPABASE_URL }}|g" js/subscribe.js
          sed -i "s|___SUPABASE_ANON_KEY___|${{ secrets.SUPABASE_ANON_KEY }}|g" js/subscribe.js
          
          # 2. unsubscribe/index.html 치환
          sed -i "s|___SUPABASE_URL___|${{ secrets.SUPABASE_URL }}|g" unsubscribe/index.html
          sed -i "s|___SUPABASE_ANON_KEY___|${{ secrets.SUPABASE_ANON_KEY }}|g" unsubscribe/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4